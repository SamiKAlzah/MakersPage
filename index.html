  <title>صانع — متجر إلكترونيات IoT و STEAM</title>
  <meta name="description" content="صانع: نوفر أدوات إنترنت الأشياء والحلول الإلكترونية لدعم المبتكرين في تحويل أفكارهم إلى نماذج أولية مبتكرة.">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

  <!-- Brand shapes (from the logo) and UI icons -->

  <header class="site-header" id="site-header">
    <div class="wrap header-row">
      <a class="brand" href="#/" aria-label="صانع — الصفحة الرئيسية">
        <img class="brand-mark" src="assets/brand/logo-mark.png" alt="" width="192" height="192">
        <img class="brand-word" src="assets/brand/logo-wordmark.png" alt="صانع" width="361" height="112">
      </a>
      <nav class="main-nav" id="main-nav" aria-label="القائمة الرئيسية"></nav>
      <div class="header-actions">
        <button class="cart-btn" type="button" data-open-cart aria-haspopup="dialog" aria-controls="cart">
          <svg class="icon" aria-hidden="true"><use href="#i-cart"/></svg>
          <span class="cart-btn-label">السلة</span>
          <span class="cart-count" id="cart-count" hidden>0</span>
          <span class="visually-hidden" id="cart-count-sr"></span>
        </button>
        <button class="icon-btn menu-toggle" type="button" id="menu-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="القائمة الرئيسية">
          <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="wrap loading" role="status">جارٍ التحميل…</div>
  </main>

  <footer class="site-footer" id="site-footer">
    <div class="wrap footer-row">
      <span class="brand brand-footer">
        <img class="brand-mark" src="assets/brand/logo-mark.png" alt="" width="192" height="192" loading="lazy">
        <img class="brand-word" src="assets/brand/logo-wordmark.png" alt="صانع" width="361" height="112" loading="lazy">
      </span>
      <nav class="footer-nav" id="footer-nav" aria-label="روابط الموقع"></nav>
      <p>الأسعار بالريال السعودي. يُؤكَّد الطلب عبر واتساب والدفع بتحويل بنكي.</p>
      <p class="footer-contact" id="footer-contact"></p>
      <p class="copy">© صانع 2026</p>
    </div>
  </footer>

  <button class="cart-bar" id="cart-bar" type="button" data-open-cart hidden>
    <span class="cart-bar-label"><svg class="icon" aria-hidden="true"><use href="#i-cart"/></svg> <span id="cart-bar-count"></span></span>
    <strong id="cart-bar-total"></strong>
  </button>

  <div class="backdrop" id="backdrop" data-close-cart></div>
  <aside class="drawer" id="cart" role="dialog" aria-modal="true" aria-labelledby="cart-title" inert>
    <header class="drawer-head">
      <h2 id="cart-title">سلة المشتريات</h2>
      <button class="icon-btn" type="button" data-close-cart aria-label="إغلاق السلة">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </header>
    <div class="drawer-body" id="cart-body"></div>
    <footer class="drawer-foot" id="cart-foot"></footer>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
